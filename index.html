<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wisp docs</title>
<meta name="description" content="wisp: one Wayland daemon that draws a whole desktop shell. Links only libc and libm. Zero idle CPU.">
<link rel="icon" href="wisp.png">
<style>
	/* numbers follow docs/_site.md "Readability" — change them there first */
	* { box-sizing: border-box; margin: 0; }
	body {
		background: #121417; color: #e4e6e9;
		font: 400 17px/1.65 system-ui, ui-sans-serif, sans-serif;
		-webkit-font-smoothing: antialiased;
		display: grid; grid-template-columns: 14rem minmax(0, 1fr) 14rem;
		min-height: 100dvh;
	}
	code, pre { font-family: ui-monospace, monospace; font-size: .9em; }
	a { color: #8ab4f8; text-decoration: underline;
		text-underline-offset: .15em; text-decoration-thickness: 1px; }
	a:hover { text-decoration-thickness: 2px; }
	aside {
		position: sticky; top: 0; align-self: start;
		max-height: 100dvh; overflow: auto;
		padding: 1rem; font-size: .85rem;
	}
	aside a { display: block; text-decoration: none; padding: .12rem 0; color: #a9b0b8; }
	aside a:hover, aside a.active { color: #e4e6e9; }
	aside a.active { text-decoration: underline; text-underline-offset: .15em; }
	.docnav summary { cursor: pointer; color: #a9b0b8; margin-top: .8rem; }
	.docnav details a { padding-left: 1rem; }
	#toc b { display: block; color: #a9b0b8; font-weight: 400; margin-bottom: .3rem; }
	#toc a.sub { padding-left: 1rem; }
	article { padding: 2.5rem 1.5rem 4rem; max-width: calc(68ch + 3rem); justify-self: center; width: 100%; }
	article h1, article h2, article h3 { line-height: 1.25; margin: 2.2em 0 .6em; letter-spacing: -.01em; }
	article h1 { font-size: 1.9rem; margin-top: 0; }
	article h2 { font-size: 1.5rem; }
	article h3 { font-size: 1.2rem; }
	article p, article ul, article ol { margin-bottom: 1.25em; }
	article pre, article .tw { margin-bottom: 1.4em; }
	article pre { background: #181b1f; padding: 1em 1.1em; line-height: 1.45; overflow-x: auto; }
	article p code, article li code, article td code, article th code {
		background: #181b1f; padding: .1em .3em; }
	.tw { overflow-x: auto; }
	table { border-collapse: collapse; width: 100%; }
	th, td { padding: .6em .9em; text-align: left; vertical-align: top; }
	td:first-child { white-space: nowrap; }
	th { border-bottom: 2px solid rgba(255,255,255,.18); font-weight: 600; }
	tbody tr + tr td { border-top: 1px solid rgba(255,255,255,.07); }
	tbody tr:nth-child(even) { background: rgba(255,255,255,.03); }
	@media (max-width: 800px) {
		body { display: block; }
		aside { position: static; max-height: none; }
		#toc { display: none; }
	}
</style>
</head>
<body>
<aside><nav class="docnav" aria-label="documentation"></nav></aside>
<article id="doc"></article>
<aside><nav id="toc" aria-label="on this page"></nav></aside>

<script type="module">
import { render } from "./web/md.js";

const RAW = "https://raw.githubusercontent.com/darealhoks/wisp/main/docs/";
const DOCS = new Set();
const doc = document.getElementById("doc");
const toc = document.getElementById("toc");
const cache = {};

function buildToc(page) {
	const hs = doc.querySelectorAll("h2, h3");
	toc.replaceChildren();
	if (!hs.length) return;
	const b = document.createElement("b");
	b.textContent = "On this page";
	toc.append(b);
	for (const h of hs) {
		const a = document.createElement("a");
		a.textContent = h.textContent;
		a.href = `#${page}/${h.id}`;
		if (h.tagName === "H3") a.className = "sub";
		toc.append(a);
	}
}

async function route() {
	let [page, anchor] = location.hash.replace(/^#/, "").split("/");
	if (!DOCS.has(page)) page = "index";
	document.querySelectorAll(".docnav a").forEach(a =>
		a.classList.toggle("active", a.getAttribute("href") === "#" + page));
	doc.innerHTML = "<p>fetching " + page + ".md…</p>";
	toc.replaceChildren();
	try {
		cache[page] ??= await fetch(RAW + page + ".md").then(r => {
			if (!r.ok) throw new Error(r.status);
			return r.text();
		});
		doc.innerHTML = render(cache[page]);
		buildToc(page);
		const el = anchor && document.getElementById(anchor);
		if (el) el.scrollIntoView(); else scrollTo(0, 0);
	} catch {
		doc.innerHTML = `<p>Couldn't fetch ${page}.md from GitHub. ` +
			`<a href="https://github.com/darealhoks/wisp/blob/main/docs/${page}.md" target="_blank" rel="noopener">Read it there ↗</a></p>`;
	}
}

// sidebar is _nav.json verbatim: sections in order, template library last
const nav = await fetch(RAW + "_nav.json").then(r => r.json());
document.querySelector(".docnav").innerHTML = nav.map(s => {
	s.pages.forEach(p => DOCS.add(p));
	return `<details open><summary>${s.section}</summary>` +
		s.pages.map(p => `<a href="#${p}">${p}</a>`).join("") +
		"</details>";
}).join("");

addEventListener("hashchange", route);
route();
</script>
</body>
</html>
